name: Validate diagnostic collector
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.10', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: node --test tests/turn-probe.test.mjs
      - name: Local baseline smoke test (discard sensitive output)
        shell: bash
        run: python skills/internet-diagnostics/scripts/collect.py --wifi --vpn > /dev/null
